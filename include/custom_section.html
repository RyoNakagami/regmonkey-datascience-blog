<script>
    document.querySelectorAll('.custom_problem .theorem-title').forEach((title) => {
        let modName = title.innerHTML;
        modName = modName.replace("Exercise", "Problem");
        modName = modName.replace("Proposition", "Property");
        modName = modName.replace("Example", "<strong>&#9654;</strong>&nbsp; Example");
        title.innerHTML = modName;
    });

    // Rule: 未使用の Corollary (#cor-, lang: ja では「系」) を Rule として表示する
    document.querySelectorAll('.custom_rule .theorem-title').forEach((title) => {
        title.innerHTML = title.innerHTML
            .replace(/^<strong>(系|Corollary)/, "<strong>Rule")
            .replace(/\s*\((.*)\)<\/strong>$/, ": $1</strong>");
        // タイトルの後で改行し，本文を次の行から始める
        title.style.display = "block";
        title.style.paddingBottom = "0.5em";
        title.style.fontSize = "1.1em";
        // 本文がリスト等で始まると Quarto がタイトル後に &nbsp; を残し空行になるため除去する
        while (title.nextSibling && title.nextSibling.nodeType === Node.TEXT_NODE
               && title.nextSibling.textContent.trim() === "") {
            title.nextSibling.remove();
        }
        if (!title.nextSibling) {
            title.parentElement.style.marginBottom = "0";
        }
    });
 </script>
